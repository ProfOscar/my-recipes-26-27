<app-header (featureSelected)="onFeatureSelected($event)"></app-header>

<div class="container">
  <div class="row">
    <div class="col-md-12">
      @if (selectedFeature == "recipes") {
      <app-recipes (shoppingListAddIngredients)="onShoppingListAddIngredients($event)"></app-recipes>
      } @else {
      <app-shopping-list #shoppingList></app-shopping-list>
      }
    </div>
  </div>
</div>
