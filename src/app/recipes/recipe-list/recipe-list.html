<div class="row">
    <div class="col-xs-12">
        <button class="btn btn-success m-3 ms-0">New Recipe</button>
    </div>
</div>
<div class="row">
    <div class="col-xs-12 list-group list-group-striped">
        <!-- <app-recipe-item></app-recipe-item> -->

        <!-- Provvisorio: non uso recipe-item e metto i dati qui -->
        @for (item of recipes; track $index) {
        <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3 my-1 border rounded">
            <div style="max-width: 70%;">
                <h5 class="mb-1">{{item.name}}</h5>
                <p class="mb-0 text-muted">{{item.desc}}</p>
            </div>
            <div>
                <img src="{{item.imgPath}}" class="img-fluid" style="max-height: 100px;" alt="{{item.name}}">
            </div>
        </a>
        }
    </div>
</div>
