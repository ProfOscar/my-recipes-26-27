<div class="row">
    <div class="col-12 col-md-10">
        <app-shopping-edit></app-shopping-edit>
        <hr class="my-4">
        <h5 class="mb-3">Lista degli Ingredienti:</h5>
        <ul class="list-group">
            @for (item of ingredients; track $index) {
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>
                    <strong>{{ item.name }}</strong>
                    <span class="badge bg-secondary rounded-pill ms-2">{{ item.amount }}</span>
                </span>
                <button class="btn btn-danger btn-sm">Elimina</button>
            </li>
            } @empty {
            <li class="list-group-item text-muted fst-italic">
                Nessun ingrediente nella lista.
            </li>
            }
        </ul>
    </div>
</div>
